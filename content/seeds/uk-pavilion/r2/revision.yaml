# 英国パビリオン前の庭（2025-07-24 撮影）の第2版。
# 自由探索の開始入口を東ゲートと西ゲートにする。座標・写真・穴は r1 を引き継ぐ。
# 会場図は同梱モデルの当たり判定から、建物の周囲約 80 m の通行範囲を塗る。
#
challenge:
  slug: uk-pavilion
  title: 英国パビリオンの赤い電話ボックス
revision:
  revisionNo: 2
  sceneProfile: bundled-v1
  scoringVersion: v1
  photoAlt: 白い穴あきパネルを積み重ねた外壁の建物を、花壇越しに見上げた写真。右手前に赤い電話ボックスが立っている
  eyeHeightMeters: 1.6
  # 写真（Xperia の超広角）の縦の画角を、3D モデルとの重ね合わせで推定した値。
  shotVerticalFovDegrees: 83.0
  # 足元 Y（9.9）＋ eyeHeightMeters（1.6）。写真と 3D モデルの輪郭の重ね合わせで求めた。
  goal: { x: -164.6, y: 11.5, z: -131.3, yawDegrees: 359.8, pitchDegrees: 14.0 }
  story: 2025年7月24日の正午前、英国パビリオン前の通路で撮影した一枚。真夏の日差しの下、花壇越しに白い外壁を見上げている。
  highlight: 庭の端に立つ赤い電話ボックスと、折り曲げた穴あきアルミパネルを重ねた白い外壁。夜は外壁の照明でユニオンジャックが浮かび上がる。
