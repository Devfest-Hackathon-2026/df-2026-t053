structures:
  - name: 英国パビリオン
    pavilionKey: uk-pavilion
    positionX: -174.9
    positionZ: -99.4
    facts: ロンドンの Woo Architects が設計した。外壁は折り曲げた穴あきアルミパネルで、穴の並びは19世紀初めに織機で使われたパンチカードを思わせる。夜は照明で外壁にユニオンジャックが浮かび上がる。パビリオンのテーマは「Come Build The Future」。
    fallbackText: 英国パビリオンです。白い外壁は、折り曲げた穴あきアルミパネルを積み重ねたもので、穴の並びは昔の織機のパンチカードがモチーフです。
    sources:
      - { title: "UK Pavilion at Expo 2025 Osaka by Woo Architects（Dezeen）", url: "https://www.dezeen.com/2025/04/15/uk-pavilion-expo-2025-osaka-woo-architects/" }
