# 英国パビリオン前の庭（2025-07-24 撮影）の第5版。
# r4 から、ガイドの解説対象（structures）に、会場図に出すパビリオンの残り 76 件を足す（#239）。
# 写真・正解姿勢・会場図・歩行領域・開始点・ランドマーク・既存 20 件の資料は r4 と同じ。
# 足した施設の代表位置は、uk-pavilion/r1 の landmarks（緯度経度の重心を変換した位置）と同じ。
# 資料の出典と確認日は content/provenance/README.md「ガイドの解説対象（r5）」に記録した。
#
