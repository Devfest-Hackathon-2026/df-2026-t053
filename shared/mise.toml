[tools]
# このプロジェクトで使う Dart の版（app は Flutter 同梱の Dart を使う）
dart = "3.13.7"

[tasks.setup]
run = "dart pub get"

[tasks.lint]
run = [
  "dart analyze --fatal-infos",
  "dart format --output=none --set-exit-if-changed lib test",
]

[tasks.test]
description = "shared のテスト（公開モデルの往復と、純 Dart の幾何ロジック）"
run = "dart test"
