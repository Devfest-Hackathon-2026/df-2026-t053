# APIテスト専用の自作仮データ。本番seedには使用しない。
# 入口名導入前の公開済みr1を変更せず更新する第2版（#206）。
# 動作確認用の仮の出題（#26）。写真・区画・正解姿勢は自作の仮データで、実在の構図ではない。
#
# 座標はモデルのローカル座標（m、+X 東、+Y 上、−Z 北）。yaw は北向き 0°、東向き 90°。
# 会場図は bounds 120 m × 120 m に対して 960×960 px（1 m = 8 px）。
challenge:
  slug: sample-plaza
  title: サンプル広場の柱
revision:
  revisionNo: 2
  sceneProfile: bundled-v1
  scoringVersion: v1
  photoAlt: 広場の奥に柱が並び、その上に空が広がる写真（仮）
  eyeHeightMeters: 1.6
  shotVerticalFovDegrees: 50.0
  # 足元 Y（0）＋ eyeHeightMeters（1.6）
  goal: { x: 0.0, y: 1.6, z: -45.0, yawDegrees: 0.0, pitchDegrees: 8.0 }
  story: 動作確認用の仮のエピソード。
  highlight: 動作確認用の仮の見どころ。
assets:
