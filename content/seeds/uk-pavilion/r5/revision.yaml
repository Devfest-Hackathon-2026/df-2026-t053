structures:
  - name: 英国パビリオン
    pavilionKey: uk-pavilion
    # ガイドの選定は代表位置から 30 m 以内を対象にする。r2 の建物中心（-174.9, -99.4）は
    # 周辺探索の開始点から 45.6 m、撮影ゴールから 33.5 m で届かなかった（#213）。
    # 南の正面の外壁から約 6 m 手前（写真の花壇のあたり）に置き、開始点から 27.3 m、
    # ゴールから 15.2 m にする。
    positionX: -172.0
    positionZ: -118.0
    facts: ロンドンの Woo Architects が設計した。外壁は折り曲げた穴あきアルミパネルで、穴の並びは19世紀初めに織機で使われたパンチカードを思わせる。夜は照明で外壁にユニオンジャックが浮かび上がる。パビリオンのテーマは「Come Build The Future」。
    fallbackText: 英国パビリオンです。白い外壁は、折り曲げた穴あきアルミパネルを積み重ねたもので、穴の並びは昔の織機のパンチカードがモチーフです。
    sources:
      - { title: "UK Pavilion at Expo 2025 Osaka by Woo Architects（Dezeen）", url: "https://www.dezeen.com/2025/04/15/uk-pavilion-expo-2025-osaka-woo-architects/" }
  - name: 三菱未来館
    pavilionKey: JpPr09
    positionX: 535.5
    positionZ: 7.3
    facts: 三菱地所設計が設計した。ひし形の上階が地面のすぐ上に浮かぶ「母船」のような姿をしている。足場用の鋼管や土のう、ブルーシートなど、ふだんは工事中にしか使わない仮設材を仕上げ材に使い、会期後に解体して再利用できるようにした。テーマは「いのち」で、上階の2つのシアターで映像体験を行う。
    fallbackText: 三菱未来館です。足場用の鋼管やブルーシートなど、工事で使う仮設材を仕上げに使った、解体して再利用できる建物です。
    sources:
      - { title: "First images of completed Expo 2025 Osaka pavilion revealed（Dezeen）", url: "https://www.dezeen.com/2025/03/18/mitsubishi-pavilion-expo-2025-osaka/" }
  - name: パナソニックグループ パビリオン「ノモの国」
    pavilionKey: JpPr08
    positionX: 496.7
    positionZ: -5.5
    facts: 建築家の永山祐子が設計した。外装は、薄く透ける布オーガンジーの膜730枚を1,404個のフレームに取り付けたもので、見る角度によって表情が変わる。建物には、使用済みの家電や工場から回収した鉄や銅を再利用している。主に子どもたちに向けたパビリオンで、「Unlock your nature」を掲げている。
    fallbackText: パナソニックグループ パビリオン「ノモの国」です。永山祐子さんが設計し、薄く透ける布の膜を重ねた外装が、見る角度によって表情を変えます。
    sources:
      - { title: "Osaka/Kansai Expo: Construction of Panasonic Group Pavilion “The Land of NOMO” Completed（Panasonic Newsroom Global）", url: "https://news.panasonic.com/global/stories/17269" }
      - { title: "Expo 2025 Osaka Panasonic Group Pavilion / Yuko Nagayama & Associates（ArchDaily）", url: "https://www.archdaily.com/1029502/expo-2025-osaka-panasonic-group-pavilion-yuko-nagayama-and-associates" }
  - name: サウジアラビア館
    pavilionKey: co12
    positionX: -78.4
    positionZ: 247.4
    facts: フォスター・アンド・パートナーズが設計した。角ばった建物群を路地のような通路でつなぎ、中央の中庭を囲む「村」のような構成で、サウジアラビアの伝統的な街路を手本にしている。外装にはサウジアラビア産の石を使い、解体して再利用できる構造にした。中庭には夜の公演用の舞台があり、高さ17メートルの壁にアート作品が投影される。
    fallbackText: サウジアラビア館です。フォスター・アンド・パートナーズが設計し、路地のような通路が中央の中庭へと続く、村のような構成になっています。
    sources:
      - { title: "Foster + Partners creates 'a village' for Saudi Arabia at Expo 2025 Osaka（Dezeen）", url: "https://www.dezeen.com/2025/04/15/saudi-arabia-pavilion-expo-2025-osaka/" }
  - name: TECH WORLD館
    pavilionKey: JpPr14
    positionX: -97.5
    positionZ: 354.4
    facts: 台湾の設計事務所MAYUが、日本の梓設計と協力して設計した。建物の形は台湾の山々に着想を得ている。館内には「生命」「自然」「未来」をテーマにした3つのシアターがあり、AI技術と3D映像を組み合わせた体験で台湾の文化と技術を紹介する。
    fallbackText: TECH WORLD館です。台湾の山々に着想を得た建物で、館内には生命・自然・未来をテーマにした3つのシアターがあります。
    sources:
      - { title: "Osaka expo Taiwan pavilion to feature smart tech and AI（Taipei Times）", url: "https://www.taipeitimes.com/News/taiwan/archives/2025/04/06/2003834703" }
      - { title: "Tech World: Mountains of the Heart（Nippon.com）", url: "https://www.nippon.com/en/guide-to-japan/expo2025077/" }
  - name: フランス館
    pavilionKey: emp10
