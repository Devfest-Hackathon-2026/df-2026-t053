  story: 2025年7月24日の正午前、英国パビリオン前の通路で撮影した一枚。真夏の日差しの下、花壇越しに白い外壁を見上げている。
  highlight: 庭の端に立つ赤い電話ボックスと、折り曲げた穴あきアルミパネルを重ねた白い外壁。夜は外壁の照明でユニオンジャックが浮かび上がる。
