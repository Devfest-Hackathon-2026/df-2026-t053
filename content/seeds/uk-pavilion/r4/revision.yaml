# 英国パビリオン前の庭（2025-07-24 撮影）の第4版。
# r3 から、ガイドの解説対象（structures）に会場の主な施設 19 件を足す（#227）。
# 写真・正解姿勢・会場図・歩行領域・開始点・ランドマーク・英国パビリオンの資料は r3 と同じ。
# 足した施設の代表位置は、uk-pavilion/r1 の landmarks（緯度経度の重心を変換した位置）と同じ。
# 資料の出典と確認日は content/provenance/README.md「ガイドの解説対象（r4）」に記録した。
#
