<text x="65" y="88" font-size="17" letter-spacing="4">KASANE TABI / EXPO 2025</text>
<text x="60" y="197" font-size="82" font-weight="700">かさね旅</text>
<text x="65" y="263" font-size="31" font-weight="600">写真の向こうを、歩こう。</text>
<text x="65" y="320" class="body">一枚の写真を手がかりに、</text>
<text x="65" y="355" class="body">誰かが見た景色を、あなたの視点で。</text>
