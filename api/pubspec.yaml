name: photohunt_server
description: 万博フォトハントの Serverpod サーバー
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  characters: ^1.4.0
  # seed の素材 SHA-256 と入力の正規化ハッシュ（#26）。
  crypto: ^3.0.0
  # seed の入力ディレクトリの解決（#26）。
  path: ^1.9.0
  photohunt_shared:
    path: ../shared
  relic_core: 2.0.0-rc.5
  stream_channel: 2.1.4
  serverpod: 4.1.1
  serverpod_auth_idp_server: 4.1.1
  # 復元した DB の検証（bin/ops.dart）。Serverpod が使う版と同じものがロックされている。
  sqlite3: ^3.9.0
  uuid: ^4.5.0
  # seed 入力（content/seeds/**.yaml）の読み込み（#26）。
  yaml: ^3.1.0

dev_dependencies:
  photohunt_client:
    path: client
  lints: ">=3.0.0 <7.0.0"
  serverpod_client: 4.1.1
  serverpod_auth_idp_client: 4.1.1
  serverpod_test: 4.1.1
  test: ^1.25.5
  analyzer: ^14.7.0
