# infrastructure/terradart の検査と plan（docs/infrastructure.md 8.3）。
# Actions の無料枠を節約するため、api.yml と同じく PR だけ・下書きでは動かさない・1 ジョブにまとめる。
# plan は読み取りだけの sa-ci-plan（WIF の gh-plan pool）で、state を書かない（-lock=false）。
# GCP の Variables が未設定（初回構築の前）なら、資格情報の要らない検査だけを行う。
name: infra

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "infrastructure/terradart/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  TERRADART_CACHE_DIR: ${{ github.workspace }}/../.terradart-cache

jobs:
  check:
    name: check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # infrastructure/terradart の config root の Dart だけを入れる（Flutter は入れない）。
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          working_directory: infrastructure/terradart
          monorepo: false

      # pub、OpenTofu 本体、provider をまとめてキャッシュする。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            ~/.cache/terradart-plugins
            ${{ env.TERRADART_CACHE_DIR }}
          key: terradart-${{ runner.os }}-${{ hashFiles('infrastructure/terradart/*/pubspec.lock', 'infrastructure/terradart/*/tf-out/prod/.terraform.lock.hcl') }}
          restore-keys: terradart-${{ runner.os }}-

      - run: mise //infrastructure/terradart:setup
      # 速く終わる検査から順に実行する。
      - run: mise //infrastructure/terradart:lint
      - run: mise //infrastructure/terradart:test
      - run: mise //infrastructure/terradart:validate

      - id: gcp
        name: GCP の設定があるか
        env:
          PROVIDER: ${{ vars.GCP_WIF_PLAN_PROVIDER }}
        run: |
          if [ -n "$PROVIDER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "GCP_WIF_PLAN_PROVIDER が未設定のため plan を飛ばす" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.gcp.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PLAN_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      # image を変えない plan にするため、サービスの template の image と RELEASE_ID を渡す。
      # リビジョンの image は index から解決した manifest の digest になり、指定値と異なる（#106）。
      - if: steps.gcp.outputs.enabled == 'true'
        name: plan（stack）
        working-directory: infrastructure/terradart
        run: |
          set -euo pipefail
          eval "$(cd stack && dart run bin/describe.dart)"
          service_json="$(gcloud run services describe "$API_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json)" || true
          if [ -z "$service_json" ]; then
            echo "サービスの設定を取得できない（初回構築の前など）ため plan を飛ばす" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export API_IMAGE RELEASE_ID
          API_IMAGE="$(jq -er '.spec.template.spec.containers[0].image | select(length > 0)' <<<"$service_json")"
          RELEASE_ID="$(jq -er '.spec.template.spec.containers[0].env[] | select(.name == "RELEASE_ID") | .value | select(length > 0)' <<<"$service_json")"
          status=0
          (cd stack && dart run terradart_cli:terradart plan --no-input --detailed-exitcode -- -lock=false -no-color) > plan.log 2>&1 || status=$?
          {
            echo "## stack の plan（prod）"
            echo
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ] && [ "$status" != 2 ]; then
            cat plan.log
            exit "$status"
          fi
