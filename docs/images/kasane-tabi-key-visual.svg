<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">かさね旅 — 写真の向こうを、歩こう。</title><desc id="desc">重なる写真のフレームと建築の線画で、写真の視点を探す旅を表現したコンセプトビジュアル。実際のゲーム画面ではありません。</desc><style>text { font-family: 'Hiragino Sans','Noto Sans JP',sans-serif; fill:#194e52 } .small {font-size:18px} .body {font-size:21px} .heading {font-size:27px;font-weight:700}</style>
